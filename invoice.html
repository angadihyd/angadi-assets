<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invoice · Angadi</title>
<link rel="icon" href="angadi/icon-192.png">
<script src="https://unpkg.com/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="admin/admin-api.js"></script>
<style>
:root{--ink:#1c1410;--muted:#6b5d52;--line:#e6dccf;--clay:#a8431f;--bg:#f2ece3;--paper:#fff}
@media (prefers-color-scheme:dark){:root:not([data-print]){--bg:#14100d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Helvetica Neue',Arial,sans-serif;color:var(--ink);padding:16px}
.bar{max-width:794px;margin:0 auto 14px;display:flex;gap:10px;justify-content:flex-end}
.bar button,.bar a{font:600 14px inherit;font-family:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--clay);background:var(--clay);color:#fff;cursor:pointer;text-decoration:none}
.bar a{background:transparent;color:var(--clay)}
.sheet{max-width:794px;margin:0 auto;background:var(--paper);padding:40px 44px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--clay);padding-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.brand img{height:54px}
.brand b{font-size:22px;letter-spacing:.04em;display:block}
.brand span{font-size:12px;color:var(--muted)}
.meta{text-align:right;font-size:13px;line-height:1.6}
.meta h1{margin:0 0 4px;font-size:24px;letter-spacing:.12em;color:var(--clay)}
.meta .id{font-family:'Courier New',monospace;font-weight:700}
.cols{display:flex;gap:30px;margin:22px 0}
.cols>div{flex:1;font-size:13px;line-height:1.6}
.cols h3{margin:0 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#f7f1e8;text-align:left;padding:9px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td{padding:10px;border-bottom:1px solid var(--line)}
.num{text-align:right;white-space:nowrap}
.tot{margin:16px 0 0 auto;width:280px;font-size:14px}
.tot div{display:flex;justify-content:space-between;padding:5px 0}
.tot .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:17px;font-weight:700}
.pay{margin-top:20px;font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid}
.pill.paid{color:#1d7a3a;border-color:#1d7a3a}.pill.due{color:#b45309;border-color:#b45309}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
#msg{max-width:794px;margin:60px auto;text-align:center;color:var(--muted)}
@media (max-width:600px){.sheet{padding:22px 16px}.head,.cols{flex-direction:column}.meta{text-align:left}.tot{width:100%}}
@page{size:A4;margin:12mm}
@media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;border-radius:0;padding:0;max-width:none}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <a href="javascript:history.length>1?history.back():window.close()">← Back</a>
  <select id="payTog" hidden onchange="PAY_OVERRIDE=this.value||null;render(CUR)" style="padding:10px;border-radius:8px;border:1px solid var(--clay);background:#fff;color:var(--ink);font:inherit">
    <option value="">Payment: auto</option><option value="paid">Mark PAID</option><option value="due">Mark DUE</option>
  </select>
  <button onclick="window.print()">Print / Save as PDF</button>
</div>
<div id="msg">Loading invoice…</div>
<div class="sheet" id="sheet" hidden></div>

<script>
// ── Business details shown on the invoice. Add gstin/fssai here once issued. ──
var BIZ = {
  name: 'Angadi',
  tagline: 'Fresh village meat, delivered',
  phone: '+91 99499 50743',
  email: 'angadihyd@gmail.com',
  site: 'www.angadi.farm',
  gstin: '',   // e.g. '36ABCDE1234F1Z5' — printed only when filled
  fssai: ''    // e.g. '13624xxxxxxxxx' — printed only when filled
};
var SUPABASE_URL = 'https://www.angadi.farm/api/supabase';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlqdmt2Z216ampod3Zyd3RsYWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDU2MDcsImV4cCI6MjA5NjA4MTYwN30.Kv1uqldZdoWjNnMbHMD2xuZ5i5tnl6cdvapgIIN6vJQ';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function fail(t){var m=document.getElementById('msg');m.textContent=t;m.hidden=false;}

async function customerOrder(id){
  // 1) logged-in customer → their own orders, filtered server-side by verified identity
  try{
    var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var s=(await sb.auth.getSession()).data.session;
    if(s){
      var r=await fetch('/api/my-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list',accessToken:s.access_token})});
      if(r.ok){var j=await r.json();var o=(j.data||[]).find(function(x){return x.order_id===id;});if(o)return o;}
    }
  }catch(e){}
  // 2) guest on the device that placed it → order id + phone must both match
  try{
    var last=JSON.parse(localStorage.getItem('angadi_last_order')||'null');
    var user=JSON.parse(localStorage.getItem('angadi_user')||'{}');
    var phone=(last&&last.customer&&last.customer.phone)||user.phone;
    if(phone){
      var r2=await fetch('/api/my-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'track',orderId:id,phone:phone})});
      if(r2.ok){var j2=await r2.json();if(j2.data&&j2.data[0])return j2.data[0];}
    }
  }catch(e){}
  return null;
}

async function adminOrder(id){
  var r=await AdminAPI.db('orders','select',{match:{order_id:id},limit:1});
  return r&&r.data&&r.data[0]||null;
}

var CUR=null,PAY_OVERRIDE=null;
function render(o){
  CUR=o;
  var c=o.customer||{},a=c.address||{};
  var items=Array.isArray(o.items)?o.items:[];
  var addr=c.addressText?esc(c.addressText).replace(/\n/g,', '):[a.flat,a.area,a.landmark,a.city,a.pincode].filter(Boolean).map(esc).join(', ');
  var sub=Number(o.subtotal)||items.reduce(function(s,i){return s+i.price*i.qty;},0);
  var paid=o.payment!=='cod'&&!!o.payment_id||['delivered','completed'].indexOf(o.status)>-1&&o.payment==='cod';
  var payLabel=o.payment==='cod'?'Cash on Delivery':'Online (Razorpay)';
  if(o.pay){paid=o.pay.indexOf('paid')===0;payLabel={paid_cash:'Cash',paid_upi:'UPI',paid_online:'Online (Razorpay)',due_cod:'Cash on Delivery'}[o.pay]||'';}
  if(window.PAY_OVERRIDE){paid=PAY_OVERRIDE==='paid';}
  var date=o.placed_at?new Date(o.placed_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Kolkata'}):'';
  var regs=[BIZ.gstin?'GSTIN: '+esc(BIZ.gstin):'',BIZ.fssai?'FSSAI Lic. No: '+esc(BIZ.fssai):''].filter(Boolean).join(' · ');
  var rows=items.map(function(i,n){
    return '<tr><td>'+(n+1)+'</td><td>'+esc(i.name)+'</td><td class="num">'+esc(i.qty)+'</td><td class="num">'+inr(i.price)+'</td><td class="num">'+inr(i.price*i.qty)+'</td></tr>';
  }).join('');
  var sheet=document.getElementById('sheet');
  sheet.innerHTML=
    '<div class="head"><div class="brand"><img src="angadi/logo.webp" alt=""><div><b>'+esc(BIZ.name)+'</b><span>'+esc(BIZ.tagline)+'</span></div></div>'+
    '<div class="meta"><h1>INVOICE</h1><div>No: <span class="id">'+esc(o.order_id)+'</span></div><div>Date: '+esc(date)+'</div></div></div>'+
    '<div class="cols"><div><h3>Billed to</h3><b>'+esc(c.name||'Customer')+'</b><br>'+esc(c.phone||'')+'<br>'+addr+'</div>'+
    '<div><h3>From</h3><b>'+esc(BIZ.name)+'</b><br>'+esc(BIZ.phone)+'<br>'+esc(BIZ.email)+'<br>'+esc(BIZ.site)+(regs?'<br>'+regs:'')+'</div></div>'+
    '<table><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="tot"><div><span>Subtotal</span><span>'+inr(sub)+'</span></div>'+
    (Number(o.discount)>0?'<div><span>Discount</span><span>−'+inr(o.discount)+'</span></div>':'')+
    '<div><span>Delivery</span><span>'+(Number(o.delivery)>0?inr(o.delivery):'FREE')+'</span></div>'+
    '<div class="grand"><span>Total</span><span>'+inr(o.total)+'</span></div></div>'+
    '<div class="pay">Payment: <b>'+esc(payLabel)+'</b> '+
    '<span class="pill '+(paid?'paid':'due')+'">'+(paid?'PAID':'PAYMENT DUE')+'</span>'+
    (o.payment_id?'<br><span style="color:#6b5d52">Ref: '+esc(o.payment_id)+'</span>':'')+'</div>'+
    '<div class="foot">Thank you for choosing Angadi.<br>This is a computer-generated invoice and needs no signature.</div>';
  document.title='Invoice '+o.order_id+' · Angadi';
  document.getElementById('msg').hidden=true;
  sheet.hidden=false;
  document.getElementById('bar').hidden=false;
  document.getElementById('payTog').hidden=!IS_ADMIN_VIEW;
}
var IS_ADMIN_VIEW=false;

(async function(){
  var q=new URLSearchParams(location.search);
  var id=(q.get('id')||'').trim();
  if(!id&&!q.get('custom')){fail('No order specified.');return;}
  var o=null;
  if(q.get('custom')){
    try{o=JSON.parse(decodeURIComponent(escape(atob(q.get('custom')))));IS_ADMIN_VIEW=true;render(o);return;}
    catch(e){fail('This custom invoice link is not valid.');return;}
  }
  if(q.get('admin')==='1'&&window.AdminAPI&&AdminAPI.isAdmin()){o=await adminOrder(id);IS_ADMIN_VIEW=!!o;}
  if(!o)o=await customerOrder(id);
  if(!o){fail('We could not find this invoice. Please log in with the phone number used for the order.');return;}
  if(o.status==='cancelled'&&q.get('admin')!=='1'){fail('This order was cancelled, so no invoice is available.');return;}
  render(o);
})();
</script>
</body>
</html>

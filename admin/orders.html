<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Angadi Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --clay:#C4622D;--clay-d:#7A3318;--clay-l:#E8956A;
  --gold:#D4A017;--cream:#F6EDD8;
  --ink:#080503;--ink-2:#100804;--ink-3:#1A0E06;
  --border:rgba(196,98,45,0.2);--border-gold:rgba(212,160,23,0.25);
  --green:#4CAF50;--red:#E57373;--blue:#64B5F6;
  --sidebar:180px;
}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--cream);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:var(--ink-2);}
::-webkit-scrollbar-thumb{background:var(--clay);border-radius:2px;}

/* ── LOGIN GUARD ── */
.guard{position:fixed;inset:0;z-index:9999;background:var(--ink);display:flex;align-items:center;justify-content:center;}
.guard.hidden{display:none;}
.guard-box{text-align:center;padding:2rem;}
.guard-box p{color:rgba(246,237,216,0.4);margin-bottom:1.5rem;}
.guard-box a{background:linear-gradient(135deg,var(--clay),var(--clay-d));color:var(--cream);text-decoration:none;padding:0.8rem 2rem;border-radius:10px;font-weight:600;}

/* ── SHARED LAYOUT (same as dashboard) ── */
.admin-layout{display:flex;min-height:100vh;}
.admin-sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--ink-2);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:1.5rem 1.2rem 1.2rem;border-bottom:1px solid var(--border);}
.sidebar-logo-text{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--cream);letter-spacing:0.08em;}
.sidebar-logo-text span{color:var(--gold);}
.sidebar-logo-sub{font-size:0.6rem;font-family:'Space Mono',monospace;color:rgba(246,237,216,0.25);letter-spacing:0.1em;text-transform:uppercase;margin-top:0.2rem;}
.sidebar-nav{flex:1;padding:1rem 0;}
.sidebar-link{display:flex;align-items:center;gap:0.7rem;padding:0.75rem 1.2rem;font-size:0.82rem;font-weight:500;color:rgba(246,237,216,0.5);text-decoration:none;transition:all 0.25s;border-left:3px solid transparent;}
.sidebar-link:hover{color:var(--cream);background:rgba(255,255,255,0.02);}
.sidebar-link.active{color:var(--cream);background:rgba(196,98,45,0.1);border-left-color:var(--clay);}
.sidebar-link .icon{font-size:1rem;flex-shrink:0;}
.sidebar-divider{height:1px;background:var(--border);margin:0.5rem 1.2rem;}
.sidebar-bottom{padding:1rem 1.2rem;border-top:1px solid var(--border);}
.sidebar-user{font-size:0.75rem;color:rgba(246,237,216,0.3);margin-bottom:0.5rem;}
.sidebar-user strong{color:rgba(246,237,216,0.55);display:block;}
.btn-logout{width:100%;background:none;border:1px solid rgba(229,115,115,0.2);color:rgba(229,115,115,0.6);border-radius:8px;padding:0.5rem;font-size:0.75rem;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:0.4rem;font-family:'DM Sans',sans-serif;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}
.admin-main{margin-left:var(--sidebar);flex:1;min-width:0;}
.admin-topbar{background:rgba(8,5,3,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--cream);}
.topbar-title span{font-style:italic;color:var(--gold);}
.btn-sm{background:rgba(196,98,45,0.1);border:1px solid var(--border);color:var(--clay-l);padding:0.4rem 0.9rem;border-radius:7px;font-size:0.75rem;cursor:pointer;transition:all 0.25s;text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;}
.btn-sm:hover{background:rgba(196,98,45,0.2);color:var(--cream);}
.btn-sm.primary{background:var(--clay);border-color:var(--clay);color:var(--cream);}
.btn-sm.primary:hover{background:var(--clay-l);}

.admin-content{padding:2rem;}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:0.8rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.filter-tab{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:100px;padding:0.4rem 1rem;font-size:0.78rem;font-weight:500;color:rgba(246,237,216,0.45);cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:0.35rem;}
.filter-tab:hover{color:var(--cream);border-color:rgba(196,98,45,0.35);}
.filter-tab.active{background:var(--clay);border-color:var(--clay);color:var(--cream);font-weight:600;}
.count-pill{background:rgba(246,237,216,0.15);border-radius:100px;padding:0.05rem 0.45rem;font-size:0.65rem;font-weight:700;}
.filter-tab.active .count-pill{background:rgba(246,237,216,0.25);}
.search-input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.9rem 0.45rem 2rem;font-size:0.8rem;color:var(--cream);font-family:'DM Sans',sans-serif;outline:none;width:200px;transition:border-color 0.3s;}
.search-input:focus{border-color:var(--clay);}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:0.7rem;top:50%;transform:translateY(-50%);font-size:0.8rem;opacity:0.35;pointer-events:none;}
.date-input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.9rem;font-size:0.78rem;color:var(--cream);font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;}
.date-input:focus{border-color:var(--clay);}

/* ── STATS ROW ── */
.stats-row{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.mini-stat{background:var(--ink-3);border:1px solid var(--border);border-radius:10px;padding:0.8rem 1.2rem;display:flex;align-items:center;gap:0.8rem;flex:1;min-width:140px;}
.mini-stat-icon{font-size:1.1rem;}
.mini-stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;line-height:1;color:var(--gold);}
.mini-stat-label{font-size:0.65rem;color:rgba(246,237,216,0.3);text-transform:uppercase;letter-spacing:0.08em;}

/* ── TABLE ── */
.table-card{background:var(--ink-3);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);}
th{padding:0.8rem 1rem;text-align:left;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(246,237,216,0.35);white-space:nowrap;}
td{padding:0.85rem 1rem;font-size:0.82rem;color:rgba(246,237,216,0.65);border-bottom:1px solid rgba(196,98,45,0.06);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.012);}
.td-id{font-family:'Space Mono',monospace;font-size:0.72rem;color:var(--gold);font-weight:700;}
.td-name{color:var(--cream);font-weight:500;}
.td-amount{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:var(--gold);}
.status-pill{display:inline-flex;align-items:center;gap:0.3rem;border-radius:100px;padding:0.22rem 0.65rem;font-size:0.68rem;font-weight:700;white-space:nowrap;}
.status-pill .dot{width:5px;height:5px;border-radius:50%;}
.status-pill.confirmed{background:rgba(100,181,246,0.12);border:1px solid rgba(100,181,246,0.2);color:var(--blue);}
.status-pill.confirmed .dot{background:var(--blue);animation:pulse 2s infinite;}
.status-pill.processing{background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.2);color:var(--gold);}
.status-pill.processing .dot{background:var(--gold);animation:pulse 2s infinite;}
.status-pill.out_for_delivery{background:rgba(196,98,45,0.1);border:1px solid var(--border);color:var(--clay-l);}
.status-pill.out_for_delivery .dot{background:var(--clay-l);animation:pulse 2s infinite;}
.status-pill.delivered{background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.2);color:var(--green);}
.status-pill.delivered .dot{background:var(--green);}
.status-pill.pending{background:rgba(255,152,0,0.12);border:1px solid rgba(255,152,0,0.25);color:#FFB74D;}
.status-pill.pending .dot{background:#FFB74D;animation:pulse 2s infinite;}
.status-pill.preparing{background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.2);color:var(--gold);}
.status-pill.preparing .dot{background:var(--gold);animation:pulse 2s infinite;}
.status-pill.ready{background:rgba(196,98,45,0.14);border:1px solid rgba(196,98,45,0.3);color:var(--clay-l);}
.status-pill.ready .dot{background:var(--clay-l);animation:pulse 1.2s infinite;}
.status-pill.assigned{background:rgba(100,181,246,0.12);border:1px solid rgba(100,181,246,0.2);color:var(--blue);}
.status-pill.assigned .dot{background:var(--blue);animation:pulse 2s infinite;}
.status-pill.picked_up{background:rgba(196,98,45,0.1);border:1px solid var(--border);color:var(--clay-l);}
.status-pill.picked_up .dot{background:var(--clay-l);animation:pulse 2s infinite;}
.status-pill.completed{background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.2);color:var(--green);}
.status-pill.completed .dot{background:var(--green);}
.act-btn{display:inline-flex;align-items:center;gap:0.3rem;padding:0.4rem 0.85rem;border-radius:8px;font-size:0.74rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--cream);transition:all 0.2s;white-space:nowrap;}
.act-btn:hover{border-color:var(--clay-l);}
.act-btn.primary{background:var(--clay);border-color:var(--clay);color:#fff;}
.act-btn.primary:hover{background:var(--clay-l);}
.act-btn.danger{color:#E57373;border-color:rgba(229,115,115,0.25);}
.act-btn.success{background:var(--green);border-color:var(--green);color:#fff;}
.status-pill.cancelled{background:rgba(229,115,115,0.08);border:1px solid rgba(229,115,115,0.15);color:var(--red);}
.status-pill.cancelled .dot{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.status-select{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:7px;padding:0.28rem 0.55rem;font-size:0.72rem;color:var(--cream);outline:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color 0.2s;}
.status-select:hover,.status-select:focus{border-color:var(--clay);}
.payment-badge{display:inline-flex;align-items:center;gap:0.3rem;font-size:0.72rem;padding:0.15rem 0.55rem;border-radius:6px;}
.payment-badge.online{background:rgba(100,181,246,0.08);border:1px solid rgba(100,181,246,0.15);color:var(--blue);}
.payment-badge.cod{background:rgba(212,160,23,0.08);border:1px solid rgba(212,160,23,0.15);color:var(--gold);}

/* Order detail panel */
.order-detail-panel{position:fixed;top:0;right:-480px;bottom:0;width:480px;background:var(--ink-2);border-left:1px solid var(--border);z-index:200;transition:right 0.35s ease;overflow-y:auto;padding:2rem;}
.order-detail-panel.open{right:0;}
.panel-close{position:absolute;top:1.5rem;right:1.5rem;background:none;border:1px solid var(--border);color:var(--cream);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all 0.2s;}
.panel-close:hover{border-color:var(--clay);background:rgba(196,98,45,0.1);}
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:190;display:none;}
.panel-overlay.open{display:block;}
.detail-section{margin-bottom:1.5rem;}
.detail-label{font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(246,237,216,0.3);margin-bottom:0.6rem;}
.detail-value{font-size:0.85rem;color:var(--cream);line-height:1.5;}
.detail-value.gold{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--gold);}
.detail-item{display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0;border-bottom:1px solid rgba(196,98,45,0.07);}
.detail-item:last-child{border-bottom:none;}
.detail-item-img{width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--ink-3);}
.detail-item-img img{width:100%;height:100%;object-fit:cover;filter:brightness(0.8);}
.detail-item-name{font-size:0.82rem;font-weight:600;color:var(--cream);}
.detail-item-meta{font-size:0.7rem;color:rgba(246,237,216,0.35);}
.detail-item-price{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--gold);flex-shrink:0;}
.wa-action-btn{width:100%;background:#25D366;color:#fff;border:none;padding:0.8rem;border-radius:10px;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:0.5rem;text-decoration:none;margin-top:0.6rem;}
.wa-action-btn:hover{background:#1ebe57;}

/* Empty state */
.empty-state{text-align:center;padding:4rem 2rem;color:rgba(246,237,216,0.25);}
.empty-state .icon{font-size:3rem;margin-bottom:1rem;opacity:0.3;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .admin-sidebar{width:60px;min-width:60px;}
  .admin-main{margin-left:60px;}
  .sidebar-logo-text,.sidebar-logo-sub,.sidebar-link span:not(.icon),.sidebar-user,.btn-logout span{display:none;}
  .sidebar-link{padding:0.9rem;justify-content:center;}
  .admin-content{padding:1rem;}
  .order-detail-panel{width:100%;right:-100%;}
  .filter-bar{gap:0.5rem;}
  .search-input{width:140px;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="guard hidden" id="guard">
  <div class="guard-box">
    <p>Please log in to access the admin panel.</p>
    <a href="dashboard.html">← Go to Login</a>
  </div>
</div>

<div class="admin-layout" id="adminLayout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">ANGADI <span>↗</span></div>
      <div class="sidebar-logo-sub">Admin Panel</div>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="dashboard.html"><span class="icon">📊</span> <span>Dashboard</span></a>
      <a class="sidebar-link active" href="orders.html"><span class="icon">📦</span> <span>Orders</span></a>
      <a class="sidebar-link" href="products.html"><span class="icon">🥩</span> <span>Products</span></a>
      <div class="sidebar-divider"></div>
      <a class="sidebar-link" href="delivery.html"><span class="icon">🚚</span> <span>Delivery</span></a>
      <div class="sidebar-divider"></div>
      <a class="sidebar-link" href="../shop.html" target="_blank"><span class="icon">🛒</span> <span>View Shop</span></a>
      <a class="sidebar-link" href="../index.html" target="_blank"><span class="icon">🌐</span> <span>View Site</span></a>

  <!-- MAIN -->
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-title">All <span>Orders</span></div>
      <div style="display:flex;gap:0.8rem;align-items:center;">
        <button class="btn-sm" onclick="exportCSV()">📊 Export CSV</button>
        <button class="btn-sm primary" onclick="refreshOrders()">↻ Refresh</button>
      </div>

    <div class="admin-content">

      <!-- STATS ROW -->
      <div class="stats-row" id="statsRow">
        <!-- populated by JS -->

      <!-- FILTERS -->

        <div class="filter-tabs-wrap" style="display:flex;gap:0.5rem;flex-wrap:wrap;" id="filterTabs">

          <button class="filter-tab" data-f="pending">🔔 New <span class="count-pill" id="cnt-pending">0</span></button>
          <button class="filter-tab" data-f="confirmed">Confirmed <span class="count-pill" id="cnt-confirmed">0</span></button>
          <button class="filter-tab" data-f="preparing">Preparing <span class="count-pill" id="cnt-preparing">0</span></button>
          <button class="filter-tab" data-f="ready">Ready <span class="count-pill" id="cnt-ready">0</span></button>
          <button class="filter-tab" data-f="assigned">Assigned <span class="count-pill" id="cnt-assigned">0</span></button>
          <button class="filter-tab" data-f="out_for_delivery">Out for Delivery <span class="count-pill" id="cnt-ofd">0</span></button>
          <button class="filter-tab" data-f="delivered">Delivered <span class="count-pill" id="cnt-delivered">0</span></button>
          <button class="filter-tab" data-f="cancelled">Cancelled <span class="count-pill" id="cnt-cancelled">0</span></button>
        </div>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input class="search-input" id="searchInput" placeholder="Order ID or customer…">
        </div>
        <input class="date-input" id="dateFilter" type="date" title="Filter by date">
      </div>

      <!-- TABLE -->
      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Slot</th>
                <th>Placed</th>
                <th>Status</th>
                <th>Update</th>

    </div>
  </div>
</div>

<!-- ORDER DETAIL PANEL -->
<div class="panel-overlay" id="panelOverlay" onclick="closeDetail()"></div>
<div class="order-detail-panel" id="detailPanel">
  <button class="panel-close" onclick="closeDetail()">✕</button>
  <div id="detailContent"><!-- populated by JS --></div>
</div>

<script>
// ─────────────────────────────────────────────
//  AUTH GUARD
// ─────────────────────────────────────────────
const IS_ADMIN = sessionStorage.getItem('angadi_admin') === '1';
if (!IS_ADMIN) {
  document.getElementById('guard').classList.remove('hidden');
  document.getElementById('adminLayout').style.display = 'none';
}
// init() is invoked at the very end of the script, after `sb` is initialised
function adminLogout(){ sessionStorage.removeItem('angadi_admin'); window.location.href='dashboard.html'; }

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function fmt(n){ return '₹'+Number(n).toLocaleString('en-IN'); }

// ── Supabase ──
const SUPABASE_URL = 'https://www.angadi.farm/api/supabase';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlqdmt2Z216ampod3Zyd3RsYWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDU2MDcsImV4cCI6MjA5NjA4MTYwN30.Kv1uqldZdoWjNnMbHMD2xuZ5i5tnl6cdvapgIIN6vJQ';
let sb = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){ console.warn('Supabase init failed', e); }

// DB row (snake_case) → UI order (camelCase)
function fromDb(r){
  return {
    orderId:o_(r.order_id), customer:r.customer, items:r.items,
    subtotal:r.subtotal, delivery:r.delivery, discount:r.discount, total:r.total,
    payment:r.payment, paymentId:r.payment_id, status:r.status,
    assignedTo:r.assigned_to, acceptedBy:r.accepted_by,
    readyAt:r.ready_at, acceptedAt:r.accepted_at, pickedUpAt:r.picked_up_at, deliveredAt:r.delivered_at,
    placedAt:r.placed_at,
  };
}
function o_(v){ return v || ''; }

const STATUS_FLOW = ['pending','confirmed','preparing','ready','assigned','picked_up','out_for_delivery','delivered','completed'];
function normaliseStatus(s){
  if (!s) return 'pending';
  if (['paid','paid_dev','confirmed_cod'].includes(s)) return 'confirmed';
  if (s==='processing') return 'preparing';
  return [...STATUS_FLOW,'cancelled'].includes(s) ? s : 'pending';
}
function statusLabel(s){
  return {pending:'Pending Review',confirmed:'Confirmed',preparing:'Preparing',ready:'Ready · Finding Partner',assigned:'Partner Assigned',picked_up:'Picked Up',out_for_delivery:'Out for Delivery',delivered:'Delivered',completed:'Completed',cancelled:'Cancelled'}[normaliseStatus(s)]||'Pending Review';
}
function formatDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

async function loadOrders(notifyNew){
  let rows = null, loadErr = null;
  if (sb){
    try {
      const { data, error } = await sb.from('orders').select('*').order('placed_at',{ascending:false});
      if (error) loadErr = error;
      else rows = (data||[]).map(fromDb);   // empty array is a valid result — do NOT show demos
    } catch(e){ loadErr = e; }
  }
  if (rows === null){
    // Supabase truly unavailable or errored — surface it instead of hiding behind demos
    if (loadErr){ console.error('Supabase read failed:', loadErr); showToast('⚠ DB read failed: '+(loadErr.message||loadErr)); }
    rows = JSON.parse(localStorage.getItem('angadi_all_orders')||'[]');
    if (rows.length < DEMOS.length) rows = DEMOS;
  }
  // detect newly-arrived pending orders for notification
  if (notifyNew){
    rows.forEach(o=>{
      if (!seenIds.has(o.orderId) && normaliseStatus(o.status)==='pending'){
        showToast('🔔 New order '+o.orderId+' — '+(o.customer?.name||''));
        beep();
      }
    });
  }
  rows.forEach(o=>seenIds.add(o.orderId));
  allOrders = rows;
}

function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); const g=a.createGain();
    o.connect(g); g.connect(a.destination); o.type='sine'; o.frequency.value=880; g.gain.value=0.05;
    o.start(); setTimeout(()=>{o.stop();a.close();},180); }catch(e){}
}

async function init(){
  await loadOrders(false);
  renderStats();
  renderTable();
  // Live updates across devices
  if (sb){
    sb.channel('orders-admin')
      .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, async () => {
        await loadOrders(true); renderStats(); renderTable();
        if (document.getElementById('detailPanel').classList.contains('open') && currentDetailId) openDetail(currentDetailId);
      }).subscribe();
  }
  // Polling fallback (in case realtime isn't enabled)
  setInterval(async ()=>{ await loadOrders(true); renderStats(); renderTable(); }, 20000);
}
async function refreshOrders(){ await loadOrders(false); renderStats(); renderTable(); showToast('Orders refreshed'); }

function renderStats(){
  const total     = allOrders.length;
  const today     = allOrders.filter(o=>{const d=new Date(o.placedAt);return d.toDateString()===new Date().toDateString();});
  const pending   = allOrders.filter(o=>['pending','confirmed','preparing','ready','assigned','picked_up','out_for_delivery'].includes(normaliseStatus(o.status)));
  const revenue   = allOrders.reduce((s,o)=>s+(o.total||0),0);
  document.getElementById('statsRow').innerHTML=`
    <div class="mini-stat"><span class="mini-stat-icon">📦</span><div><div class="mini-stat-val">${total}</div><div class="mini-stat-label">Total Orders</div></div></div>
    <div class="mini-stat"><span class="mini-stat-icon">🔔</span><div><div class="mini-stat-val">${today.length}</div><div class="mini-stat-label">Today</div></div></div>
    <div class="mini-stat"><span class="mini-stat-icon">🚚</span><div><div class="mini-stat-val">${pending.length}</div><div class="mini-stat-label">Pending</div></div></div>
    <div class="mini-stat"><span class="mini-stat-icon">💰</span><div><div class="mini-stat-val" style="font-size:1.1rem;">${fmt(revenue)}</div><div class="mini-stat-label">Total Revenue</div></div></div>
  `;
  // Counts
  const counts={};
  allOrders.forEach(o=>{ const s=normaliseStatus(o.status); counts[s]=(counts[s]||0)+1; });
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v||0;};
  set('cnt-all',total);
  set('cnt-pending',counts.pending);
  set('cnt-confirmed',counts.confirmed);
  set('cnt-preparing',counts.preparing);
  set('cnt-ready',counts.ready);
  set('cnt-assigned',(counts.assigned||0)+(counts.picked_up||0));
  set('cnt-ofd',counts.out_for_delivery);
  set('cnt-delivered',(counts.delivered||0)+(counts.completed||0));
  set('cnt-cancelled',counts.cancelled);
}

function renderTable(){
  const filtered = allOrders.filter(o=>{
    const s=normaliseStatus(o.status);
    const mStatus = activeFilter==='all'||s===activeFilter;
    const q=searchQuery.toLowerCase();
    const mSearch=!q||(o.orderId||'').toLowerCase().includes(q)||(o.customer?.name||'').toLowerCase().includes(q)||(o.customer?.phone||'').includes(q);
    const mDate=!dateFilter||new Date(o.placedAt).toISOString().slice(0,10)===dateFilter;
    return mStatus&&mSearch&&mDate;
  }).sort((a,b)=>new Date(b.placedAt)-new Date(a.placedAt));

  const tbody=document.getElementById('ordersBody');
  if(!filtered.length){
    tbody.innerHTML=`<tr><td colspan="11"><div class="empty-state"><div class="icon">🔍</div>No orders found</div></td></tr>`;
    return;
  }
  tbody.innerHTML=filtered.map(o=>{
    const s=normaliseStatus(o.status);
    const items=(o.items||[]).map(i=>i.name.split(' · ')[0]).slice(0,2).join(', ')+((o.items||[]).length>2?'…':'');
    return `
      <tr style="cursor:pointer;" onclick="openDetail('${o.orderId}')">
        <td class="td-id">${o.orderId}</td>
        <td class="td-name">${o.customer?.name||'—'}</td>
        <td style="font-family:'Space Mono',monospace;font-size:0.72rem;">${o.customer?.phone||'—'}</td>
        <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;">${items}</td>
        <td class="td-amount">${fmt(o.total||0)}</td>
        <td><span class="payment-badge ${o.payment==='cod'?'cod':'online'}">${o.payment==='cod'?'💵 COD':'💳 Online'}</span></td>
        <td style="font-size:0.75rem;">${(o.customer?.slot||'—').split(' ')[0]}</td>
        <td style="font-size:0.75rem;white-space:nowrap;">${formatDate(o.placedAt)}</td>
        <td><span class="status-pill ${s}"><span class="dot"></span>${statusLabel(o.status)}</span></td>
        <td onclick="event.stopPropagation()">
          ${actionButtons(o)}
        </td>
        <td onclick="event.stopPropagation()">
          <a href="https://wa.me/${(o.customer?.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent('Hi '+o.customer?.name+'! Your Angadi order '+o.orderId+' is '+statusLabel(o.status)+'.')}" target="_blank" class="btn-sm">💬</a>
        </td>
      </tr>
    `;
  }).join('');
}

// ─────────────────────────────────────────────
//  ACTIONS
// ─────────────────────────────────────────────
// Contextual next-step buttons for the admin's part of the pipeline
function actionButtons(o, big){
  const s = normaliseStatus(o.status);
  const cls = big ? 'act-btn' : 'act-btn';
  const b = (label, st, kind='') => `<button class="${cls} ${kind}" onclick="event.stopPropagation();setOrderStatus('${o.orderId}','${st}')">${label}</button>`;
  const cancel = b('✕ Cancel','cancelled','danger');
  switch(s){
    case 'pending':   return b('✓ Confirm Order','confirmed','primary') + cancel;
    case 'confirmed': return b('👨‍🍳 Start Preparing','preparing','primary') + cancel;
    case 'preparing': return b('📣 Mark Ready','ready','primary') + cancel;
    case 'ready':     return `<span class="act-btn" style="cursor:default;opacity:0.7;">⏳ Finding partner…</span>` + cancel;
    case 'assigned':  return `<span class="act-btn" style="cursor:default;opacity:0.7;">🛵 ${o.acceptedBy||'Partner'} assigned</span>`;
    case 'picked_up': return `<span class="act-btn" style="cursor:default;opacity:0.7;">📦 Picked up</span>`;
    case 'out_for_delivery': return `<span class="act-btn" style="cursor:default;opacity:0.7;">🚚 Out for delivery</span>`;
    case 'delivered': return b('🏁 Mark Completed','completed','success');
    case 'completed': return `<span class="act-btn" style="cursor:default;opacity:0.7;">✅ Completed</span>`;
    case 'cancelled': return `<span class="act-btn danger" style="cursor:default;">Cancelled</span>`;
    default: return '';
  }
}

async function setOrderStatus(orderId, newStatus){
  if(!newStatus) return;
  const idx=allOrders.findIndex(o=>o.orderId===orderId);
  if(idx===-1) return;
  const now = new Date().toISOString();
  const patch = { status:newStatus };
  if (newStatus==='ready')     patch.ready_at = now;
  if (newStatus==='delivered') patch.delivered_at = now;
  // optimistic local update
  allOrders[idx].status = newStatus;
  if (newStatus==='ready') allOrders[idx].readyAt = now;
  renderStats(); renderTable();
  if(document.getElementById('detailPanel').classList.contains('open') && currentDetailId===orderId) openDetail(orderId);
  showToast(`✓ ${orderId} → ${statusLabel(newStatus)}`);
  // persist
  if (sb){
    const { error } = await sb.from('orders').update(patch).eq('order_id', orderId);
    if (error){ console.warn('update failed', error); showToast('⚠ Save failed — check connection'); }
  } else {
    localStorage.setItem('angadi_all_orders', JSON.stringify(allOrders));
  }
}

function exportCSV(){
  const rows=[['Order ID','Customer','Phone','Address','Items','Subtotal','Delivery','Discount','Total','Payment','Status','Slot','Date']];
  allOrders.forEach(o=>{
    const a=o.customer?.address||{};
    rows.push([o.orderId,o.customer?.name||'',o.customer?.phone||'',[a.flat,a.area,a.pincode].filter(Boolean).join(', '),(o.items||[]).map(i=>i.name.split(' · ')[0]+'×'+i.qty).join(' | '),o.subtotal||0,o.delivery||0,o.discount||0,o.total||0,o.payment||'',o.status||'',o.customer?.slot||'',o.placedAt||'']);
  });
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`angadi-orders-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  showToast('✓ CSV exported');
}

// Filter events
document.querySelectorAll('.filter-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));

  });
});
document.getElementById('searchInput').addEventListener('input',function(){ searchQuery=this.value; renderTable(); });
document.getElementById('dateFilter').addEventListener('change',function(){ dateFilter=this.value; renderTable(); });

function showToast(msg){
  document.querySelectorAll('.angadi-toast').forEach(t=>t.remove());
  const toast=document.createElement('div'); toast.className='angadi-toast';
  toast.style.cssText=`position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#C4622D;color:#F6EDD8;padding:0.6rem 1.4rem;border-radius:100px;font-size:0.82rem;font-weight:600;z-index:9999;white-space:nowrap;animation:fadeToast 2.5s forwards;`;
  toast.textContent=msg;
  if(!document.getElementById('tStyle')){const s=document.createElement('style');s.id='tStyle';s.textContent=`@keyframes fadeToast{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}`;document.head.appendChild(s);}
  document.body.appendChild(toast); setTimeout(()=>toast.remove(),2600);
}

if (IS_ADMIN) init();
